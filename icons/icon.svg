<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Main Center Icon: Zendure Solar Flow Modular PV Battery Stack -->
    
    <!-- Top PV Hub Controller Unit -->
    <rect x="186" y="80" width="140" height="58" rx="10" fill="#ffffff" />
    <!-- PV Hub Screen / LED Strip Cutout -->
    <rect x="202" y="94" width="108" height="18" rx="5" fill="#6dac20" />
    <!-- Energy Lightning Bolt in Hub -->
    <polygon points="258,97 246,104 254,104 250,111 262,102 254,102" fill="#ffffff" />
    <circle cx="212" cy="103" r="3" fill="#ffffff" />
    <circle cx="222" cy="103" r="3" fill="#ffffff" />

    <!-- Battery Stack Module 1 (Middle) -->
    <rect x="186" y="146" width="140" height="60" rx="10" fill="#ffffff" />
    <rect x="198" y="158" width="116" height="36" rx="6" fill="#6dac20" />
    <!-- Charge Level Bars -->
    <rect x="208" y="166" width="22" height="20" rx="3" fill="#ffffff" />
    <rect x="234" y="166" width="22" height="20" rx="3" fill="#ffffff" />
    <rect x="260" y="166" width="22" height="20" rx="3" fill="#ffffff" />
    <rect x="286" y="166" width="22" height="20" rx="3" fill="#ffffff" opacity="0.4" />

    <!-- Battery Stack Module 2 (Bottom) -->
    <rect x="186" y="214" width="140" height="60" rx="10" fill="#ffffff" />
    <rect x="198" y="226" width="116" height="36" rx="6" fill="#6dac20" />
    <!-- Charge Level Bars -->
    <rect x="208" y="234" width="22" height="20" rx="3" fill="#ffffff" />
    <rect x="234" y="234" width="22" height="20" rx="3" fill="#ffffff" />
    <rect x="260" y="234" width="22" height="20" rx="3" fill="#ffffff" />
    <rect x="286" y="234" width="22" height="20" rx="3" fill="#ffffff" />

    <!-- Stand Feet -->
    <rect x="202" y="278" width="28" height="8" rx="3" fill="#ffffff" />
    <rect x="282" y="278" width="28" height="8" rx="3" fill="#ffffff" />

    <!-- Flanking Left Symbol: Photovoltaic Solar Panel -->
    <g transform="translate(118, 168)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" />
      <polygon points="-12,8 -6,-10 6,-10 12,8" fill="#6dac20" />
      <line x1="0" y1="-10" x2="0" y2="8" stroke="#ffffff" stroke-width="2" />
      <line x1="-9" y1="-1" x2="9" y2="-1" stroke="#ffffff" stroke-width="2" />
    </g>

    <!-- Flanking Right Symbol: Grid Power / Plug -->
    <g transform="translate(394, 168)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" />
      <rect x="-11" y="-8" width="22" height="15" rx="3" fill="#6dac20" />
      <rect x="-7" y="-16" width="4" height="8" rx="1" fill="#6dac20" />
      <rect x="3" y="-16" width="4" height="8" rx="1" fill="#6dac20" />
      <line x1="0" y1="7" x2="0" y2="15" stroke="#6dac20" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="0.5">Zendure Solar Flow</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>
