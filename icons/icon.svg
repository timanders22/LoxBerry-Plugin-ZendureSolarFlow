<?xml version="1.0" encoding="utf-8"?>
<!-- Zendure SolarFlow - Plugin-Symbol.
     Hausstandard: runde Scheibe in LoxBerry-Gruen #6dac20, Motiv am echten
     Geraet orientiert. Die SolarFlow-Reihe ist ein flacher, breiter Quader mit
     abgerundeten Kanten; darunter stapeln sich die Akkupacks.
     Bewusst KEINE fremden Wortmarken oder Logos, auch nicht angedeutet. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <circle cx="256" cy="256" r="256" fill="#6dac20"/>

  <!-- Wechselrichtereinheit oben -->
  <rect x="126" y="132" width="260" height="86" rx="22" ry="22" fill="#ffffff" opacity="0.96"/>
  <rect x="126" y="132" width="260" height="86" rx="22" ry="22"
        fill="none" stroke="#3d6412" stroke-width="10"/>
  <rect x="154" y="160" width="86" height="14" rx="7" ry="7" fill="#3d6412"/>
  <circle cx="344" cy="175" r="14" fill="#3d6412"/>

  <!-- Zwei gestapelte Akkupacks -->
  <rect x="146" y="238" width="220" height="62" rx="16" ry="16" fill="#ffffff" opacity="0.9"/>
  <rect x="146" y="238" width="220" height="62" rx="16" ry="16"
        fill="none" stroke="#3d6412" stroke-width="9"/>
  <rect x="146" y="318" width="220" height="62" rx="16" ry="16" fill="#ffffff" opacity="0.9"/>
  <rect x="146" y="318" width="220" height="62" rx="16" ry="16"
        fill="none" stroke="#3d6412" stroke-width="9"/>

  <!-- Fuellstandsbalken in den Packs -->
  <rect x="168" y="256" width="130" height="26" rx="8" ry="8" fill="#6dac20" opacity="0.6"/>
  <rect x="168" y="336" width="86" height="26" rx="8" ry="8" fill="#6dac20" opacity="0.6"/>

  <!-- Blitz als Sinnbild fuer den Energiefluss -->
  <path d="M268 214 l-34 44 h26 l-12 40 40 -54 h-26 z" fill="#ffffff"
        stroke="#3d6412" stroke-width="7" stroke-linejoin="round"/>
</svg>
