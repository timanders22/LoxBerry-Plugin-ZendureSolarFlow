W_S1 = "Get the templates: above in step 3, click “%s” and “%s” with period “%s” – for device 1; another device carries its number instead of the 1 in all names."
W_S2 = "In Loxone Config, import both files as templates under “Virtual Inputs” – once each, a second import creates everything twice."
W_S3 = "Create a new page and drag the commands from the templates onto it: from “%s” #1–#6 and #14–#19, from “%s” #23–#29."
W_S4 = "Place the remaining blocks via the block search (key F5), enter the parameters as in the table and wire them according to the column “%s”."
W_S5 = "Create the two notifications (#13, #22) under Periphery → Messages and drag them onto the page; each gets exactly one source."
W_S6 = "In the plugin, Settings tab, set “%s” to the suggestion – only then does the temperature (#19) arrive in °C."
W_S7 = "Save and transfer to the Miniserver. This page writes nothing to the device."
S_S1 = "First build the page above (then the template “%s” is already imported). In addition, above in step 3, click “%s” and import the file as a template under “Virtual Outputs” in Loxone Config."
S_S2 = "Create a new page; drag #1–#6 from “%s” onto it (OK and HAUS a second time), and #19, #20, #24, #28, #30, #32, #34 and #36 from “%s”."
S_S3 = "Create virtual inputs (Periphery → Virtual Inputs, “Use in visualisation” on): #8 as a switch, #22 and #35 as push buttons, #27, #29, #31 and #33 as sliders with min, max and step as in the table."
S_S4 = "Connect “Netzleistung (eigene Quelle)” (#7) to your own electricity meter – power in W, plus = import, minus = feed-in. If the input already exists from “AnkerSolix Steuerung”, drag it onto the page a second time; otherwise create it as an analog virtual input (min -30000, max 30000)."
S_S5 = "Place the remaining blocks via the block search (key F5), enter the parameters as in the table and wire them according to the column “%s”."
S_S6 = "In the plugin, Settings tab, tick “%s”; “%s” stays 0 (off)."
S_S7 = "Save and transfer. In the app, set each slider once to its start value (Loxone only sends on a change), then switch on “Lade-/Entlade-Regelung ein”."
W_H1 = "The analog value validation gets the constant 1 at En; if the run counter stands still longer than Tmc, its output E reports."
W_H1_EN = "Config creates input En inverted (tick at ‘En’ in the properties under Parameters). Remove this tick, otherwise constant 1 arrives as 0 and the failure message never triggers."
W_H2 = "The on-delay only reports when the fault persists – short dropouts of the device stay silent."
W_H3 = "All faults run through OR into one notification; a notification block gets only one source."
W_H4 = "“Zendure Speicher” brings the battery into the energy flow monitor; formula #31 turns watts into kilowatts (see the connection to the energy flow monitor above)."
W_H5 = "A dash instead of a number means the device did not deliver the value; Loxone keeps the last one. That is why #9 reports via OK when the values are not fresh."
S_H1 = "Write brake 30 s: a slider moved within 30 s after a control value is rejected by the plugin – then move the slider once more."
S_H2 = "Loxone only sends an unchanged value after a change: if the control is switched on again with exactly the wishes it stopped with, they go out only with the next change."
S_H3 = "When the control ends (switch off or fault), edge detection #21 hands control back to the device via OR #23; the analog memories stay put instead of sending 0 W."
S_H4 = "An output command may only be inserted once in Loxone – that is why ZENDURE_1_CMD_AUS is only on this page."
S_H5 = "Leave the fallback in the plugin off (0 minutes, factory setting): this page hands control back itself."
S_H6 = "The limits 800 W and 1000 W (#11, #12, #31, #33) apply to the SolarFlow 800; for another model enter the values from the Settings tab."
S_H7 = "This page has no notification: faults are reported by the page above (#13)."
S_H8 = "Percentages are written “(Proz)” in names because Config turns “%” into “_”."

