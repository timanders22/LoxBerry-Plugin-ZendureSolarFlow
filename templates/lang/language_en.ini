WIEDERHOLUNG_ERKLAERUNG = "Up to 0.9.10 <b>every</b> set point was written, including the unchanged one. At the recommended 60 s send interval that is 1440 flash writes a day for a value that did not change — in a plugin whose write brake is explicitly justified by flash write endurance. The brake limits the <i>interval</i>, not the <i>repetition</i>. Skipped commands are reported, not silently dropped."
ZUORDNUNG_ERKLAERUNG = "Which property of the device sits behind which field of the plugin? The defaults come from the official Home Assistant integration and have been measured against <b>no</b> device. If your firmware names a field differently, the value stays empty — then enter the correct name here. What the fields are really called on your system is shown by the field explorer on the Test tab."
ZUORDNUNG_HILFE = "Leaving a box empty means <b>use the default</b>, not „no mapping“. The <i>value read</i> column shows what arrived under the effective name during the last poll — the quickest way to see whether a change takes hold."
ZUORD_FEHLT = "does not occur"

