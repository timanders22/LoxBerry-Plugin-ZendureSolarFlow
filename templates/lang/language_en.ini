H_WACHE = "Writer watch"
WACHE_ERKLAERUNG = "The endpoint remembers per device who sends setpoints (charge, discharge, off, state of charge and power limits): the identifier from <span class='sm-mono'>&amp;von=</span> (the template sets <span class='sm-mono'>von=loxone</span>) and the sender address. If several writers send setpoints to the same device within the time window, this is shown in the log, in the <i>Test</i> tab and in the response as <span class='sm-mono'>;SCHREIBER=n</span>. Nothing is rejected because of it."
L_WACHE_EIN = "Report several writers (log, Test tab)"
L_WACHE_FENSTER_MIN = "Time window of the writer watch (minutes)"
H_WACHE_FENSTER = "1 to 120 minutes, default 15. Within this window, setpoints from two different writers to the same device count as two writers."
L_WACHE_LB = "Also as a LoxBerry notification when new writers appear"
L_WACHE_SPERREN = "Reject foreign writers (HTTP 409)"
H_WACHE_SPERREN = "<b>Off by default.</b> Only switch it on when the <i>Test</i> tab has shown only the expected writers for a week. Then every setpoint from a writer that is not in the list gets HTTP 409 <span class='sm-mono'>GRUND=FREMDSCHREIBER</span>, and nothing is queued. This also applies to <span class='sm-mono'>aus</span>: with the command set zensdk it sets the same values as <span class='sm-mono'>entladen</span> with 0 W. Note: a Loxone template without <span class='sm-mono'>von=loxone</span> appears as <i>without identifier</i> and would be locked out by the list <span class='sm-mono'>loxone</span> — then add the address of the Miniserver as well."
L_WACHE_ERLAUBT = "Allowed writers"
H_WACHE_ERLAUBT = "Separated by commas, each entry an identifier (<span class='sm-mono'>loxone</span>), an address (for example that of the Miniserver) or both as identifier@address (<span class='sm-mono'>loxone@&lt;address&gt;</span>). At most 16 entries. Only effective with <i>Reject foreign writers</i>."
FEHLER_WACHE_LISTE = "Allowed writers: %s"
