[LOX]
EINLEITUNG = "Loxone is the energy manager: the plugin supplies the readings, the Miniserver decides. Two routes are available — MQTT is the standard route, the HTTP endpoint the alternative when single values are to be fetched deliberately or commands are to be sent."
H_TITEL = "Loxone integration, step by step"
K_TOKEN_NEU = "Generate new token"
K_VORLAGE = "Download template for Loxone Config"
MEHRERE = "Several devices: one address per device."
S1_TEXT = "<b>MQTT is the standard route.</b> The gateway creates the names of the virtual inputs itself; in Loxone a suitably named virtual input is then enough. The HTTP route needs its own command recognition per value — in exchange it can also switch, which MQTT cannot do here. Using both in parallel is allowed and sensible in many installations: MQTT for the running values, HTTP for the commands."
S1_TITEL = "Step 1: choose the route"
S2_TEXT = "Enter under <i>Subscriptions</i> in <i>System → MQTT Gateway</i> and save:"
S2_TITEL = "Step 2: enter the subscription in the MQTT gateway"
S2_WARNUNG = "<b>Without this entry nothing arrives at the Miniserver.</b> This is the single most common cause of failure."
S3_BEFEHLE = "Below it one <i>Virtual HTTP input command</i> per value. In the command recognition the search text goes between <span class='sm-mono'>\i...\i</span>, and <span class='sm-mono'>\v</span> picks up the number behind it."
S3_STRICH = "<b>A dash instead of a number</b> means the device did not supply that field. No 0 is sent on purpose — a 0 would be a silent false statement. Loxone then keeps the last valid value. That is exactly why <span class='sm-mono'>ALTER</span> and <span class='sm-mono'>OK</span> should always be evaluated as well: without them a frozen value looks like a current one in the app."
S3_TEXT = "Over MQTT the inputs appear by themselves. If you take the HTTP route, create a <i>Virtual HTTP input</i> in Loxone Config with this address:"
S3_TITEL = "Step 3: create virtual inputs"
S4_TEXT = "Only needed if Loxone is to control the storage system. Prerequisite: write commands are enabled in the Settings tab. Create a <i>Virtual output</i> with the address of the LoxBerry, and below it one <i>Virtual output command</i> per command; Loxone replaces <span class='sm-mono'>&lt;v&gt;</span> with the numeric value."
S4_TITEL = "Step 4: sending commands (virtual output)"
S4_WARNUNG = "<b>Two things to know beforehand.</b> First: there is <b>no watchdog</b>. If Loxone fails, the last set point sent stays in force; if you do not want that, have Loxone send <span class='sm-mono'>aktion=aus</span> once before a planned shutdown. Second: the <b>write throttle</b> rejects commands that follow too closely — a control loop sending every second will get nothing but refusals. The send rate in Loxone has to match the throttle, not the other way round."
S5_TEXT = "The endpoint sits in the unauthenticated area so that Loxone can reach it without credentials. It is therefore protected by a token; without a matching token it answers HTTP 403. A new token invalidates every address already entered in the Miniserver."
S5_TITEL = "Step 5: the token"
S6_TEXT = "If a device goes silent the virtual inputs keep their last value — and everything looks normal in the app. That is why <span class='sm-mono'>ALTER</span> is evaluated: it counts the seconds since the last value from that device. Set the threshold well above the polling interval so that a single missed run does not raise an alarm: at a 15 s interval, 180 s is a good value. As a side benefit <span class='sm-mono'>ALTER</span> avoids any time arithmetic — Loxone counts seconds since 2009-01-01, so a Unix timestamp would first have to be reduced by 1230768000."
S6_TITEL = "Step 6: fault detection"
S7_ERLAEUTERUNG = "<b>On #9:</b> the threshold is deliberately far above the polling interval. At a 15 s interval a single missed run would otherwise already raise a message.<br><b>On #11 and #13:</b> the notification block only fires on a change from off to on. Never wire several sources directly to its input therefore, but merge them through an OR first — otherwise one permanently active source swallows all the others.<br><b>On #24:</b> the send rate must be <b>longer</b> than the write throttle in the Settings tab, otherwise the service rejects every second command. 60 s against a 30 s throttle is a safe ratio.<br><b>On #27 and #28:</b> charging and discharging are two separate commands. They must not overtake each other — that is why the same pulse generator sits in front of both, and the charge branch is blocked through #17 while discharging.<br><b>Optional</b> are #14 to #16 (low charge warning and display)."
S7_TEXT = "Every row is one block. Loxone Config lists them all in the block search (key F5). Rows 1 to 16 build the plain monitoring including the fault and low-charge messages — that is enough if Loxone is only meant to watch. Rows 17 to 28 are added if Loxone is to set the power; they require write commands to be enabled."
S7_TITEL = "Step 7: complete block list to rebuild one to one"
S8_TEXT = "Open these three addresses in a browser. If the first answers with values, the second with 403 and the third with 400, then the setup holds."
S8_TITEL = "Step 8: cross-check"
TOKEN_NEU = "A new token has been generated. <b>The addresses in Loxone have to be adjusted</b> — the old ones no longer work."
