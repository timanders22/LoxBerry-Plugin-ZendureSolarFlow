RUECKFALL_ERKLAERUNG = "<b>Zendure does not stop by itself.</b> A set point stays where it is, even if the Miniserver fails, the network cable is pulled or someone deletes a block. The service can hand control back after a waiting time. <b>Off by default</b> — it intervenes in a running installation, and that has to be switched on deliberately."
