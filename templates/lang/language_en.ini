PLATZHALTER = "<span class='sm-mono'>N</span> is the device number from the Settings tab, <span class='sm-mono'>&lt;SN&gt;</span> the serial number of a battery pack."
THEMEN_ERKLAERUNG = "After every poll the service sends what changed, and after the configured time (at most 3600 s) the complete picture. <span class='sm-mono'>status/ts</span> and <span class='sm-mono'>status/zaehler</span> go out as a sign of life at most every 30 s, even if nothing changes. If a reading is missing, <span class='sm-mono'>-1</span> goes out (temperature <span class='sm-mono'>-999</span>) — never an invented zero; only the battery power <span class='sm-mono'>batp</span> and the power of a battery pack, which can also be negative, are then not sent at all. A retained state without a statement goes out as <span class='sm-mono'>-</span>. If a device does not answer, only <span class='sm-mono'>online</span> goes out."
