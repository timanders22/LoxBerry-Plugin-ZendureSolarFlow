SCHUTZ_ERKLAERUNG = "Reject set points that are not good for the battery. <b>Important to know:</b> this check does <b>not</b> block when the measurement is missing or older than 15 minutes — a protection that shuts the battery down on every hiccup does more damage than the case it protects against. The device has its own battery management; these thresholds are comfort, not safety. If the measurement is missing, the command goes through and that is <b>reported</b>."
STEUERUNG_ERKLAERUNG = "Write commands interfere with a running storage system. They are disabled by default and must be enabled here explicitly. <b>Important:</b> the command shapes are taken from the official Home Assistant integration but could not be tried on a live system for lack of a device. Watch the Zendure app alongside on your first attempt."
