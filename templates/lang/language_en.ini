[EINST]
BROKER_ERKLAERUNG = "Only needed if at least one device runs over MQTT. If the fields stay empty the plugin uses the broker from the LoxBerry system settings — usually the right one. The credentials are not passed to mosquitto on the command line but through its config file with mode 0600: on the command line they would appear in the process list."
DIENST_ERKLAERUNG = "The service polls the devices with an HTTP interface at the configured interval and at the same time listens to the devices that report over MQTT. The user interface and the Miniserver only read the cache — they never talk to a device themselves. A watchdog running every minute restarts the service if it crashes; a service stopped by hand stays stopped."
DIENST_RESTART = "Service restarted."
DIENST_START = "Service started."
DIENST_STOP = "Service stopped."
ENERGIE_ERKLAERUNG = "A Zendure device reports instantaneous power, not counter readings. The service <b>integrates the power itself</b> — that works even if a firmware delivers no counters at all. From it come daily, monthly and yearly figures, running counters, full cycles and efficiency. <b>This is not a calibrated measurement:</b> integration happens over the poll interval, and nobody sees what happens between two polls. At a 15 second interval the error is small, at 900 seconds it is not."
FEHLER_BEREICH = "%s: the value must be between %d and %d."
FEHLER_BROKER = "The broker address is neither a valid name nor a valid address."
FEHLER_GRENZE = "Row %d: the power limits must be whole numbers."
FEHLER_IP = "Row %d: that is neither an IPv4 address nor a valid host name."
FEHLER_IP_FEHLT = "Row %d: an HTTP device needs an IP address."
FEHLER_KAPAZITAET = "Row %d: the capacity must be a number in kilowatt hours, for example 1.92 or 3,84."
FEHLER_MQTT_IDS = "Row %d: an MQTT device needs a product key and a device id."
FEHLER_MQTT_MUSTER = "Row %d: product key and device id may only contain letters, digits, hyphen and underscore."
FEHLER_NAME = "Row %d: the name must not contain a semicolon or an equals sign. Both separate the fields in the reply to the Miniserver."
FEHLER_QUITTUNGSFELD = "Row %d: the ack field must be a property name — letters, digits and underscore, starting with a letter."
FEHLER_SOC_REIHE = "The lower state-of-charge limit has to be smaller than the upper one. The previous values stay as they were."
FEHLER_SPEICHERN = "The configuration could not be written: %s"
FEHLER_TOPIC = "The topic prefix may only contain letters, digits, hyphen, underscore and slash, at most 64 characters, not empty, no slash at the start or end and no two slashes in a row. The previous prefix stays."
FEHLER_ZAHL = "%s: please enter a whole number."
FEHLER_ZUORDNUNG = "The mapping for %s is not a valid property name — letters, digits and underscore, starting with a letter. The previous mapping stays as it was."
GERAETE_ERKLAERUNG = "<b>Zendure can be addressed locally</b> — this plugin does not need a Zendure account. There are two routes, and which applies depends on the model:<br><b>HTTP</b> — SolarFlow 800 and the AC range answer <span class='sm-mono'>http://&lt;ip&gt;/properties/report</span> directly on the home network. The IP address is enough.<br><b>MQTT</b> — Hub 1200, Hub 2000, Hyper 2000, Ace 1500 and AIO 2400 speak MQTT only. They are switched over to the LoxBerry broker once (see the MQTT tab) and report by themselves afterwards. For that the product key and the device id are needed."
GERAETE_HILFE = "<b>Product key and device id</b> appear in the topics the device publishes on the broker: <span class='sm-mono'>/&lt;productKey&gt;/&lt;deviceId&gt;/properties/report</span>. If you do not know them, the LoxBerry MQTT gateway can show all incoming topics under <i>MQTT Finder</i> — both are in there.<br><b>Empty power limits</b> mean the factory limit of the selected model applies (table below). If your model is not listed there, enter the limits yourself."
GESPEICHERT = "The settings have been saved, including a backup copy for updates."
H_BROKER = "Broker for the MQTT devices"
H_BROKER_PW = "If left empty the stored password is kept. It is never displayed."
H_DIENST = "Polling service"
H_ENERGIE = "Energy counters"
H_GERAETE = "Devices"
H_INTERVALL = "Applies to the HTTP devices only; the MQTT devices report by themselves whenever something changes. The poll happens on the home network and costs practically nothing — 15 seconds is a good value, 5 seconds works too."
H_KONFIG = "Back up and restore settings"
H_MODELLE = "Known models"
H_MQTT_AUFFR = "Otherwise only <b>what changed</b> is sent. After this time everything goes out anyway, so that a restarted gateway gets a complete picture. At most 3600 s; 0 switches the suppression off. The sign of life <span class='sm-mono'>status/ts</span> and <span class='sm-mono'>status/zaehler</span> goes out independently at most every 30 s."
H_QUITTUNGSFELD = "<b>Ack field</b> — only needed for the command sets <span class='sm-mono'>hyper2000</span>, <span class='sm-mono'>ace_aio</span> and <span class='sm-mono'>hub</span>. For those it is nowhere documented which property a command shows up in; without an entry the acknowledgement therefore stays empty. The command-set assistant on the Test tab proposes the field."
H_QUITTUNG_NACHLAUF = "That much time a device gets to report a set value back. Before that, a deviation is not yet a statement and <span class='sm-mono'>SOLLOK</span> stays a dash. 0 switches the grace period off."
H_RUECKFALL = "Fallback when Loxone falls silent"
H_RUECKFALL_MIN = "If no new charge or discharge value arrives for that long, the service sends <span class='sm-mono'>aus</span> once. State-of-charge limits are not affected — those are settings and are meant to stay. The remaining time is in the status line as <span class='sm-mono'>RESTZEIT</span>."
H_SCHREIBBREMSE = "Minimum gap between two write commands to the same device. <b>This is not a nicety.</b> The official integration notes explicitly for the Ace 1500 that every write goes to the device flash and that an unthrottled control loop would burn through its endurance within months. This plugin therefore throttles for every device. 0 disables the throttle — at your own risk."
H_SCHRITTWEITE = "Set points are rounded down to this grid, for the same reason as the write throttle. The rounding is reported in the answer, not concealed — you always learn which value was actually sent."
H_SCHUTZ = "Protection thresholds"
H_SCHUTZ_TEMP = "The temperature limits are in the <b>selected unit</b>. If the conversion is set to <i>raw</i>, they are raw values — then 0 and 45 are almost certainly wrong. The Test tab shows which unit fits your device."
H_STEUERUNG = "Write commands"
H_TAKT = "Polling interval"
H_TEMP = "<b>The unit Zendure reports temperature in is not documented</b> — the Home Assistant integration passes the value through unchanged. The conversion therefore defaults to <i>raw</i>. Look at the raw value in the Test tab: around 3000 means tenths of a kelvin, around 250 means tenths of a degree, around 25 means it is already correct."
H_TOTBAND_AUFFR = "Even an unchanged value is sent again after this time — in case the device forgot it (power cut, firmware restart). 0 switches the refresh off; a constant set point is then never written again."
H_TOTBAND_W = "0 means: only the <b>identical</b> value is skipped. A larger dead band also skips small changes — that saves more flash but makes control less responsive."
H_VERFALL = "A command waits in the file system, not in the request. If the service is down — crashed, stopped, LoxBerry restarted — it is executed at the next start, however many hours later. Carrying out last night’s <span class='sm-mono'>charge 3000 W</span> this morning is not a delayed control action, it is a wrong one. Applies to charge and discharge values only; <span class='sm-mono'>off</span>, limits and refresh do not expire."
H_WARTEZEIT = "This is how long the Miniserver endpoint waits for the result of a command. If nothing arrives it answers <span class='sm-mono'>OK=2</span> — queued, result unknown. A success nobody verified is never reported."
H_WIEDERHOLUNG = "Repeat suppression"
H_ZUORDNUNG = "Field mapping"
KEIN_ACLADEN = "no grid charging"
