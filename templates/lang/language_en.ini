[LOX]
EINLEITUNG = "Loxone is the energy manager: the plugin supplies the readings, the Miniserver decides. Two routes are available — MQTT is the standard route, the HTTP endpoint the alternative when single values are to be fetched deliberately or commands are to be sent."
H_TITEL = "Loxone integration, step by step"
H_VORLAGE_ZEITRAUM = "Affects the energy template only. There is one template each for day, month and year — download what you need."
K_TOKEN_NEU = "Generate new token"
K_VORLAGE = "Download template for Loxone Config"
K_VORLAGE_ALLE = "All templates as an archive"
K_VORLAGE_BEFEHLE = "Create command template"
K_VORLAGE_ENERGIE = "Create energy template"
K_VORLAGE_SUMME = "Create total template"
L_VORLAGE_GERAET = "Template for device"
L_VORLAGE_ZEITRAUM = "Period of the energy template"
MEHRERE = "Several devices: one address per device."
S1_TEXT = "<b>MQTT is the standard route.</b> The gateway creates the names of the virtual inputs itself; in Loxone a suitably named virtual input is then enough. The HTTP route needs its own command recognition per value — in exchange it can also switch, which MQTT cannot do here. Using both in parallel is allowed and sensible in many installations: MQTT for the running values, HTTP for the commands."
S1_TITEL = "Step 1: choose the route"
S2_TEXT = "The topic group of this plugin is:"
S2_TITEL = "Step 2: the subscription in the MQTT gateway"
S3_BEFEHLE = "Below it one <i>Virtual HTTP input command</i> per value. In the command recognition the search text goes between <span class='sm-mono'>\i...\i</span>, and <span class='sm-mono'>\v</span> picks up the number behind it."
S3_STRICH = "<b>A dash instead of a number</b> means the device did not supply that field. No 0 is sent on purpose — a 0 would be a silent false statement. Loxone then keeps the last valid value. That is exactly why <span class='sm-mono'>ALTER</span> and <span class='sm-mono'>OK</span> should always be evaluated as well: without them a frozen value looks like a current one in the app."
S3_TEXT = "Over MQTT the inputs appear by themselves. If you take the HTTP route, create a <i>Virtual HTTP input</i> in Loxone Config with this address:"
S3_TITEL = "Step 3: create virtual inputs"
S4_TEXT = "Only needed if Loxone is to control the storage system. Prerequisite: write commands are enabled in the Settings tab. Create a <i>Virtual output</i> with the address of the LoxBerry, and below it one <i>Virtual output command</i> per command; Loxone replaces <span class='sm-mono'>&lt;v&gt;</span> with the numeric value."
S4_TITEL = "Step 4: sending commands (virtual output)"
S4_VORLAGE = "You do <b>not</b> have to copy these addresses: the button <i>Create command template</i> above builds them ready to import, with the token filled in."
S4_WARNUNG = "<b>Two things to know beforehand.</b> First: Zendure keeps a set point even when Loxone falls silent. Against that the plugin has a <b>fallback (watchdog)</b>: Settings tab, <i>Fallback when Loxone falls silent</i> — off by default. When switched on, the service sends <span class='sm-mono'>aus</span> once after that many minutes without a new charge or discharge value; if the device rejects it, it tries again. Second: the <b>write throttle</b> rejects commands that follow too closely — a control loop sending every second will get nothing but refusals. The send rate in Loxone has to match the throttle, not the other way round."
S5_TEXT = "The endpoint sits in the unauthenticated area so that Loxone can reach it without credentials. It is therefore protected by a token; without a matching token it answers HTTP 403. A new token invalidates every address already entered in the Miniserver."
S5_TITEL = "Step 5: the token"
S6_TEXT = "If a device goes silent the virtual inputs keep their last value — and everything looks normal in the app. That is why two values belong in every integration: <span class='sm-mono'>OK</span> drops to 0 as soon as a poll fails or the snapshot is older than three times the polling interval, and <span class='sm-mono'>ZAEHLER</span> counts up by one with every run of the service (0–999). The first list in step 7 feeds OK into a NOT and the counter into an analog value validation (constant 1 at En); if it stands still longer than Tmc, its output E reports. For reading off there is also <span class='sm-mono'>ALTER</span>, the seconds since the last value from that device."
S6_TITEL = "Step 6: fault detection"
S7_TEXT = "Two pages from the LoxBerry plugins sample project, every row one block (block search in Loxone Config: key F5). The first page shows the values, reports faults and keeps the daily balance — that is enough if Loxone is only meant to watch. The second is added if Loxone is to charge and discharge the storage; it requires write commands to be enabled."
S7_TITEL = "Step 7: two complete block lists to rebuild one to one"
S8_TEXT = "Open these three addresses in a browser. If the first answers with values, the second with 403 and the third with 400, then the setup holds."
S8_TITEL = "Step 8: cross-check"
S9_EINGAENGE = "Power ← <span class='sm-mono'>BATP</span>, storage level ← <span class='sm-mono'>SOC</span>"
S9_HERKUNFT = "The parameters come from Loxone’s own example <span class='sm-mono'>Energy-Flow-Monitor-and-Energy-Manager.loxone</span>, not from a guess."
S9_KW = "<b>Mind the unit:</b> the plugin delivers <b>watts</b>, the block displays kilowatts. Put a formula block <span class='sm-mono'>I1/1000</span> in between, or set the input unit accordingly."
S9_TEXT = "Loxone represents a battery in the energy flow monitor through a <b>meter block with absolute storage level</b>. It needs two inputs: the power and the state of charge in percent. This plugin already delivers both."
S9_TITEL = "Connecting to the energy flow monitor"
S9_ZAEHLER = "Meter with absolute storage level"
