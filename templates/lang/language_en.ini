AUTOSTART_AUS = "The gateway is <b>not</b> set to autostart. Without it there is neither a broker for the Zendure devices nor a route to the Miniserver. Remedy: <i>System → MQTT Gateway</i>, switch autostart on."
AUTOSTART_EIN = "The gateway is set to autostart."
GATEWAY_ERKLAERUNG = "Since LoxBerry 3 the MQTT gateway is <b>part of the system</b>, not a plugin. It is not installed separately but switched on under <i>System → MQTT Gateway</i>. A note for troubleshooting: the broker host defaults to <span class='sm-mono'>localhost</span>. The fact that something is entered there does not mean messages can arrive — what matters is the autostart setting."
