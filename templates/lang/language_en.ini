ABO_DATEI = "<b>The gateway subscribes to the topic group by itself</b> — the subscription file of this plugin (<span class='sm-mono'>mqtt_subscriptions.cfg</span>) carries it; nothing needs to be entered by hand."
H_V2 = "Gateway V2: tick these data points"
V2_ERKLAERUNG = "With <b>MQTT gateway V2</b> only what is ticked in the gateway's <i>Subscriptions</i> reaches the Miniserver. This table is the list for it – topic, name of the virtual input in Loxone and whether <i>Noncached</i> must be set (for “ok” and the heartbeats). The values of the single battery packs (<span class='sm-mono'>geraetN/pack/…</span>) carry the serial number in their name and are left out on purpose, as are the timestamp and sums with only one device. The line in the <i>Test</i> tab checks whether everything is ticked."
