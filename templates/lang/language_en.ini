T_UDP = "UDP inbound port"
T_USER = "User"
UMSTELLEN_TEXT = "For devices that run over MQTT only. In the Zendure app, under the advanced settings of the device, switch the MQTT server from the Zendure cloud to the LoxBerry. Older devices do not have this item in the app — for those there is a web Bluetooth tool provided by the Zendure community. Enter:"
UMSTELLEN_WARNUNG = "<b>A device can do either cloud or local</b>, not both. After the switch the Zendure app loses the connection to that device and shows no values; you can go back by setting the server to the cloud again. If the broker user above is empty the LoxBerry broker runs without authentication — only do that on a network you trust."
M_LEEREN_WECHSEL = "The topic prefix was changed from <span class='sm-mono'>%s</span> to <span class='sm-mono'>%s</span>; the retained topics under the old prefix were cleared:"
