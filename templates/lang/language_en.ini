DVOLT = "Largest cell voltage difference, raw value from the device"
ENTLADEN = "Power out of the battery"
FW = "firmware version — stays empty until you enter the field under field mapping"
GRENZEAUS = "Configured output limit"
GRENZEEIN = "Configured input limit"
HAUS = "Output to the house"
LADEN = "Power into the battery"
MS = "response time of the last poll — HTTP devices only; an MQTT device reports by itself"
NETZ = "Intake from the grid"
OK = "1 = the values are fresh, 0 = fault"
PACKS = "Number of detected battery packs"
PV = "Solar power"
RESTZEIT = "seconds until the fallback hands control back; — when the fallback is off or no set point is running"
SOC = "State of charge"
SOCMAX = "Upper state of charge limit"
SOCMIN = "Lower state of charge limit"
SOLL = "last value set (watts or percent), — if none was ever set"
SOLLALTER = "how long ago the value was set"
SOLLOK = "1 = the device reports the set value back, 0 = it reports something else, — = no statement yet"
TEMP = "Highest pack temperature"
ZAEHLER = "heartbeat of the service: runs 0 to 999 and wraps. If it stops, every other value is frozen. −1 if the service never ran"

[ZD_MQTT]
ACMODUS = "1 = intake, 2 = output"
BATP = "Battery power in watts, positive = charging, negative = discharging"
DVOLT = "Largest cell voltage difference across all packs, raw value from the device"
ENTLADEN = "Power out of the battery in watts"
E_GES_ENTLADEN = "running counter discharged in kWh"
E_GES_LADEN = "running counter charged in kWh"
E_HEUTE = "energy today per field (pv, haus, netz, laden, entladen) in kWh"
E_JAHR = "energy in the current year per field in kWh"
E_MONAT = "energy in the current month per field in kWh"
E_WIRKUNG = "efficiency in percent"
E_ZYKLEN = "full cycles"
GERAETE = "Number of configured devices"
GRENZE_AUS = "Configured output limit in watts"
GRENZE_EIN = "Configured input limit in watts"
HAUS = "Output to the house in watts"
LADEN = "Power into the battery in watts"
MS = "response time in milliseconds"
NETZ = "Intake from the grid in watts"
OK = "1 = at least one device answers"
ONLINE = "1 = the values are fresh"
PACKS = "Number of detected battery packs"
PV = "Solar power in watts"
P_DVOLT = "Cell voltage difference of this battery pack, raw value"
P_SOC = "State of charge of this battery pack in percent"
P_TEMP = "Temperature of this battery pack"
P_VOLT = "Total voltage of this battery pack, raw value"
P_WATT = "Power of this battery pack in watts"
SOC = "State of charge in percent"
SOC_MAX = "Upper state of charge limit in percent"
SOC_MIN = "Lower state of charge limit in percent"
SOLL = "last value set"
SOLLOK = "acknowledgement: 1 adopted, 0 not adopted (absent while no statement is possible)"
S_ALTER = "total: age of the oldest value"
S_BATP = "total: battery power"
S_HAUS = "total: output to the house"
S_KAPAZ = "total: capacity in kWh"
S_NETZ = "total: draw from the grid"
S_PV = "total: solar power"
S_RESTKWH = "total: stored energy in kWh"
S_SOC = "total: state of charge, weighted by capacity"
TEMP = "Highest temperature across all packs"

[ZD_SFELD]
ALTER = "age of the oldest value"
BATP = "battery power of all devices together"
HAUS = "output to the house of all devices together"
KAPAZ = "capacity of all devices together"
N = "number of configured devices"
NETZ = "draw from the grid of all devices together"
NOK = "how many of them are not answering right now"
OK = "1 = all devices answer"
PV = "solar power of all devices together"
RESTKWH = "stored energy of all devices together"
SOC = "state of charge across all devices, weighted by capacity"
