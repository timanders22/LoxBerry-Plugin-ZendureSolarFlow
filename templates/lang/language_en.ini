ABO_WARNUNG_UNBEKANNT = "The subscription file of this plugin is missing, and the version of your MQTT gateway could not be determined. The file is written when saving in the MQTT tab and when the service starts. <b>Version 1:</b> without this entry nothing arrives at the Miniserver — by far the most common cause of failure there. <b>Version 2 and newer:</b> the subscription page no longer exists, the gateway forwards on its own."
ABO_WARNUNG_V1 = "<b>The subscription file of this plugin is missing — without it or a manual entry nothing arrives at the Miniserver.</b> This is by far the most common cause of failure. The file <span class='sm-mono'>mqtt_subscriptions.cfg</span> is written when saving in the MQTT tab and when the service starts. Until then the topic group belongs under <i>System → MQTT Gateway</i> in the <i>Subscriptions</i> section; save afterwards."
