WACHE_M_TEXT = "a single text is expected."
WACHE_M_LANG = "the list is longer than 512 characters."
WACHE_M_STEUER = "the list contains control characters."
WACHE_M_TEILE = "not understood: %s. Each entry is an identifier (1 to 32 characters from letters, digits, _ and -), an address or identifier@address, at most 16 entries."
SICH_WACHE_KREUZ = "In the file, Reject foreign writers is switched on but the list of allowed writers is empty — every setpoint would be rejected."
SICH_WACHE_BEHALTEN = "The backup predates the writer watch and does not contain its settings (%s). The current values remain."
WAS_IST_DAS = "<b>Zendure SolarFlow on the Loxone Miniserver – no cloud, no Zendure account.</b> The service polls the newer devices through their local HTTP interface at the configured interval and listens to the older series over local MQTT. The values go into a cache; the Miniserver reads them through virtual HTTP inputs or MQTT and switches charging, discharging and charge limits through a virtual output. Neither the user interface nor the Miniserver ever talks to a device itself."
SICH_OHNE_G43 = "The backup does not know %s yet (older than 0.9.38) – the current setting stays for these."
SICH_BEFEHLE_AUS = "“Accept commands via MQTT” was on in the backup but stays off – please switch it on deliberately in tab MQTT."

