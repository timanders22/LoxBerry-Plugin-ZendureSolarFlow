MODELLE_HILFE = "This table was looked up line by line in the source of the official Zendure Home Assistant integration. Models that were not looked up there — Hub 2000, SolarFlow 1600 AC+ and SolarFlow 4000 AC+ for example — are deliberately <b>not</b> in it: nothing is guessed. For those, pick the command set by hand and try it in the Test tab. The three sets differ not in name but in the shape of the message; a wrong set does not produce an error, it simply makes nothing happen."
MODELL_FREI = "(none)"
PW_GESETZT = "stored, %d characters — leave empty to keep"
PW_LEER = "none stored"
RUECKFALL_ERKLAERUNG = "<b>Zendure does not stop by itself.</b> A set point stays where it is, even if the Miniserver fails, the network cable is pulled or someone deletes a block. The service can hand control back after a waiting time. <b>Off by default</b> — it intervenes in a running installation, and that has to be switched on deliberately."
SATZ_AUTO = "(from model)"
SCHUTZ_ERKLAERUNG = "Reject set points that are not good for the battery. <b>Important to know:</b> this check does <b>not</b> block when the measurement is missing or older than 15 minutes — a protection that shuts the battery down on every hiccup does more damage than the case it protects against. The device has its own battery management; these thresholds are comfort, not safety. If the measurement is missing, the command goes through and that is <b>reported</b>."
STEUERUNG_ERKLAERUNG = "Write commands interfere with a running storage system. They are disabled by default and must be enabled here explicitly. <b>Important:</b> the command shapes are taken from the official Home Assistant integration but could not be tried on a live system for lack of a device. Watch the Zendure app alongside on your first attempt."
