T_RETAIN = "Retained"
RETAIN_JA = "yes"
RETAIN_NEIN = "no"
RETAIN_ERKLAERUNG = "Retained means the broker keeps the last value, so Loxone has it again immediately after the Miniserver or the broker restarts. That is right for states – state of charge, setpoints, operating mode, running counters. Power, voltage and temperature are NOT retained: after an outage an old value would stand there and look like a fresh reading. Neither are the daily, monthly and yearly values, which become wrong by the clock alone, the sign of life, or the statements the service makes about itself – ok and online per device. A retained state without a statement shows <span class='sm-mono'>-</span>. Topics of a removed device or battery pack are cleared by the service."
