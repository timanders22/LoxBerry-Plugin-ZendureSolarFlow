; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Zendure SolarFlow"
K02 = "Connects Zendure SolarFlow batteries to Loxone — <b>without the cloud and without a Zendure account</b>."
K03 = "Two ways, both local"
K04 = "<b>HTTP</b> — SolarFlow 800, 800 Plus, 800 Pro and the AC series answer <span class='sm-mono'>http://&lt;ip&gt;/properties/report</span> directly on the home network. Entering the IP address is enough."
K05 = "<b>MQTT</b> — Hub 1200, Hub 2000, Hyper 2000, Ace 1500 and AIO 2400 speak MQTT only. They are switched over to the LoxBerry broker once (Zendure app or Bluetooth tool) and report in by themselves afterwards. <b>Note:</b> after that the Zendure app no longer shows any values — a device can do either cloud or local, not both."
K06 = "How to proceed"
K07 = "<b>Settings:</b> enter the devices, save, then <i>Start service</i>."
K08 = "<b>Test:</b> the self-check tells you line by line whether it holds. Every failed line names the remedy."
K09 = "<b>MQTT:</b> enter the subscription in the MQTT gateway. Without that entry nothing arrives at the Miniserver."
K10 = "<b>Loxone integration:</b> step by step, with a complete list of blocks to rebuild it."
K11 = "The write brake"
K12 = "On some devices every write command ends up in flash memory. The official Home Assistant integration explicitly notes for the Ace 1500 that an unthrottled control loop would use up its write endurance within months. This plugin therefore lets through at most one command every 30 seconds and rounds set points to 50 W. <b>The send interval in Loxone has to match</b> — otherwise the service rejects every second command."
K13 = "No watchdog"
K14 = "Unlike the Marstek battery, Zendure does not stop by itself when Loxone falls silent. A set point stays where it is. If you do not want that, have Loxone send <span class='sm-mono'>aktion=aus</span> once before a planned shutdown."
K15 = "What has not been tested"
K16 = "This plugin was built without a Zendure device. The property names, the command forms and the units of temperature and cell voltage could therefore not be measured against a live system. If a value stays empty, that is more likely a differently named field than a fault: the <i>View raw data as JSON</i> button on the Test tab shows what the fields are really called on your system."
K17 = "Basis"
K18 = "All protocol details come from the official Home Assistant integration by Zendure (Zendure/Zendure-HA, MIT licence)."
