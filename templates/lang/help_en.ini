; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Zendure SolarFlow"
K02 = "Connects Zendure SolarFlow batteries to Loxone — <b>without the cloud and without a Zendure account</b>."
K03 = "Two ways, both local"
K04 = "<b>HTTP</b> — SolarFlow 800, 800 Plus, 800 Pro and the AC series answer <span class='sm-mono'>http://&lt;ip&gt;/properties/report</span> directly on the home network. Entering the IP address is enough."
K05 = "<b>MQTT</b> — Hub 1200, Hub 2000, Hyper 2000, Ace 1500 and AIO 2400 speak MQTT only. They are switched over to the LoxBerry broker once (Zendure app or Bluetooth tool) and report in by themselves afterwards. <b>Note:</b> after that the Zendure app no longer shows any values — a device can do either cloud or local, not both."
K06 = "How to proceed"
K07 = "<b>Settings:</b> enter the devices, save, then <i>Start service</i>."
K08 = "<b>Test:</b> the self-check tells you line by line whether it holds. Every failed line names the remedy."
K09 = "<b>MQTT:</b> the plugin writes the subscription for the MQTT gateway into its own subscription file (mqtt_subscriptions.cfg). Only if the MQTT tab reports in red that it is missing does it belong under Subscriptions by hand — without a subscription nothing arrives at the Miniserver."
K10 = "<b>Loxone integration:</b> step by step, with a complete list of blocks to rebuild it."
K11 = "The write brake"
K12 = "On some devices every write command ends up in flash memory. The official Home Assistant integration explicitly notes for the Ace 1500 that an unthrottled control loop would use up its write endurance within months. This plugin therefore lets through at most one command every 30 seconds and rounds set points to 50 W. <b>The send interval in Loxone has to match</b> — otherwise the service rejects every second command. The same value within 60 seconds is not sent at all and is answered with <span class='sm-mono'>UNVERAENDERT=1</span>; the brake applies to a different value."
K13 = "Fallback when Loxone falls silent"
K14 = "Zendure does not stop by itself when Loxone falls silent: a set point stays where it is. For that the plugin has a fallback (watchdog): Settings tab, <i>Fall back after (minutes)</i> — off by default. When switched on, the service sends <span class='sm-mono'>aus</span> once after that time without a new charge or discharge value, and tries again if the device rejects it. State-of-charge limits stay."
K15 = "What has not been tested"
K16 = "This plugin was built without a Zendure device. The property names, the command forms and the units of temperature and cell voltage could therefore not be measured against a live system. If a value stays empty, that is more likely a differently named field than a fault: the <i>View raw data as JSON</i> button on the Test tab shows what the fields are really called on your system."
K17 = "Basis"
K18 = "All protocol details come from the official Home Assistant integration by Zendure (Zendure/Zendure-HA, MIT licence)."
K19 = "Writer watch"
K20 = "The endpoint remembers per device who sends setpoints — the identifier from <span class='sm-mono'>&amp;von=</span> (the template sets <span class='sm-mono'>von=loxone</span>) and the sender address. Identifiers of the house plugins: <span class='sm-mono'>loxone</span> (templates), <span class='sm-mono'>einspeisebremse</span>, <span class='sm-mono'>awattar</span>, <span class='sm-mono'>evcc</span>. If several writers send setpoints to the same device within the time window (default 15 minutes), this is shown in the log, in the <i>Test</i> tab (writers of the last 24 hours) and in the response as <span class='sm-mono'>;SCHREIBER=n</span>; nothing is rejected. Only with <i>Reject foreign writers</i> (off by default) does a writer that is not in the list get HTTP 409 <span class='sm-mono'>GRUND=FREMDSCHREIBER</span> — also for <span class='sm-mono'>aus</span>, which with the command set zensdk sets the same values as <span class='sm-mono'>entladen</span> with 0 W. An invalid identifier is rejected with HTTP 400 <span class='sm-mono'>GRUND=VON</span>; an address without <span class='sm-mono'>von</span> always works. <span class='sm-mono'>abruf</span> and reading calls are not affected."
