FEHLER_MQTT_MUSTER = "Zeile %d: Produktschl&uuml;ssel und Ger&auml;tekennung d&uuml;rfen nur Buchstaben, Ziffern, Bindestrich und Unterstrich enthalten."
FEHLER_SPEICHERN = "Die Konfiguration liess sich nicht schreiben: %s"
