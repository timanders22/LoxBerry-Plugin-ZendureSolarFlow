MODELLE_HILFE = "Diese Tabelle ist im Quelltext der offiziellen Home-Assistant-Integration von Zendure nachgesehen, Zeile für Zeile. Modelle, die dort nicht nachgesehen wurden — etwa Hub 2000, SolarFlow 1600 AC+ und SolarFlow 4000 AC+ — stehen bewusst <b>nicht</b> darin: geraten wird nichts. Für sie wählt man den Befehlssatz von Hand und probiert ihn im Reiter Test durch. Die drei Sätze unterscheiden sich nicht im Namen, sondern in der Form der Nachricht; ein falscher Satz führt nicht zu einer Fehlermeldung, sondern dazu, dass schlicht nichts passiert."
