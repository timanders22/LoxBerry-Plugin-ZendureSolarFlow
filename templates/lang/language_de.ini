FEHLER_BROKER = "Die Broker-Adresse ist kein g&uuml;ltiger Name und keine g&uuml;ltige Adresse."
FEHLER_GRENZE = "Zeile %d: Die Leistungsgrenzen m&uuml;ssen ganze Zahlen sein."
FEHLER_IP = "Zeile %d: Das ist weder eine IPv4-Adresse noch ein g&uuml;ltiger Hostname."
