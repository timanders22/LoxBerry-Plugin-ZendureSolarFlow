[EINST]
BROKER_ERKLAERUNG = "Nur nötig, wenn mindestens ein Gerät über MQTT läuft. Bleiben die Felder leer, nimmt das Plugin den Broker aus den LoxBerry-Systemeinstellungen — also in aller Regel den richtigen. Die Zugangsdaten werden dem Aufruf von mosquitto nicht auf der Kommandozeile mitgegeben, sondern über dessen Vorgabedatei mit den Rechten 0600: auf der Kommandozeile stünden sie in der Prozessliste."
DIENST_ERKLAERUNG = "Der Dienst fragt die Geräte mit HTTP-Schnittstelle im eingestellten Takt ab und hört gleichzeitig auf die Geräte, die ihre Werte per MQTT melden. Oberfläche und Miniserver lesen nur den Zwischenspeicher — sie sprechen selbst nie mit einem Gerät. Ein minutlicher Wächter startet den Dienst neu, wenn er abstürzt; ein von Hand angehaltener Dienst bleibt angehalten."
DIENST_RESTART = "Dienst neu gestartet."
DIENST_START = "Dienst gestartet."
DIENST_STOP = "Dienst angehalten."
ENERGIE_ERKLAERUNG = "Ein Zendure-Gerät meldet Augenblicksleistungen, keine Zählerstände. Der Dienst <b>integriert die Leistung selbst</b> — das funktioniert auch dann, wenn eine Firmware gar keine Zähler liefert. Daraus entstehen Tages-, Monats- und Jahreswerte, fortlaufende Zählerstände, Vollzyklen und Wirkungsgrad. <b>Das ist keine geeichte Messung:</b> integriert wird über den Abfragetakt, und was zwischen zwei Abrufen geschieht, sieht niemand. Bei 15 Sekunden Takt ist der Fehler klein, bei 900 Sekunden ist er es nicht."
FEHLER_BEREICH = "%s: der Wert muss zwischen %d und %d liegen."
FEHLER_BROKER = "Die Broker-Adresse ist kein gültiger Name und keine gültige Adresse."
FEHLER_GRENZE = "Zeile %d: Die Leistungsgrenzen müssen ganze Zahlen sein."
FEHLER_IP = "Zeile %d: Das ist weder eine IPv4-Adresse noch ein gültiger Hostname."
FEHLER_IP_FEHLT = "Zeile %d: Ein HTTP-Gerät braucht eine IP-Adresse."
FEHLER_KAPAZITAET = "Zeile %d: Die Kapazität muss eine Zahl in Kilowattstunden sein, etwa 1.92 oder 3,84."
FEHLER_MQTT_IDS = "Zeile %d: Ein MQTT-Gerät braucht Produktschlüssel und Gerätekennung."
FEHLER_MQTT_MUSTER = "Zeile %d: Produktschlüssel und Gerätekennung dürfen nur Buchstaben, Ziffern, Bindestrich und Unterstrich enthalten."
FEHLER_NAME = "Zeile %d: Der Name darf kein Semikolon und kein Gleichheitszeichen enthalten. Beide trennen die Felder in der Antwort an den Miniserver."
FEHLER_QUITTUNGSFELD = "Zeile %d: Das Quittungsfeld muss ein Eigenschaftsname sein — Buchstaben, Ziffern und Unterstrich, beginnend mit einem Buchstaben."
FEHLER_SOC_REIHE = "Die untere Ladezustandsgrenze muss kleiner sein als die obere. Die bisherigen Werte bleiben stehen."
FEHLER_SPEICHERN = "Die Konfiguration ließ sich nicht schreiben: %s"
FEHLER_TOPIC = "Das Themen-Präfix darf nur Buchstaben, Ziffern, Bindestrich, Unterstrich und Schrägstrich enthalten und nicht leer sein."
FEHLER_ZAHL = "%s: bitte eine ganze Zahl eintragen."
FEHLER_ZEILE_ALT = "Die bisherige Angabe dieser Zeile bleibt stehen."
FEHLER_ZEILE_WEG = "Diese Zeile wurde nicht übernommen."
FEHLER_ZUORDNUNG = "Die Zuordnung für %s ist kein gültiger Eigenschaftsname — Buchstaben, Ziffern und Unterstrich, beginnend mit einem Buchstaben. Die bisherige Zuordnung bleibt stehen."
GERAETE_ERKLAERUNG = "<b>Zendure lässt sich lokal ansprechen</b> — ein Zendure-Konto braucht dieses Plugin nicht. Es gibt zwei Wege, und welcher gilt, hängt am Modell:<br><b>HTTP</b> — SolarFlow 800 und die AC-Reihe beantworten im Heimnetz unmittelbar <span class='sm-mono'>http://&lt;ip&gt;/properties/report</span>. Es genügt die IP-Adresse.<br><b>MQTT</b> — Hub 1200, Hub 2000, Hyper 2000, Ace 1500 und AIO 2400 sprechen nur MQTT. Sie werden einmalig auf den Broker des LoxBerry umgestellt (siehe Reiter MQTT) und melden sich danach von selbst. Dafür werden Produktschlüssel und Gerätekennung gebraucht."
GERAETE_HILFE = "<b>Produktschlüssel und Gerätekennung</b> stehen in den Themen, die das Gerät am Broker veröffentlicht: <span class='sm-mono'>/&lt;Produktschlüssel&gt;/&lt;Gerätekennung&gt;/properties/report</span>. Wer sie nicht kennt, lässt sich im MQTT-Gateway des LoxBerry unter <i>MQTT Finder</i> alle eingehenden Themen anzeigen — dort stehen beide.<br><b>Leere Leistungsgrenzen</b> bedeuten: die Werksgrenze des gewählten Modells gilt (Tabelle unten). Wer ein Modell hat, das dort nicht steht, trägt die Grenzen selbst ein."
GESPEICHERT = "Die Einstellungen wurden gespeichert, samt Sicherungskopie für Updates."
GESPEICHERT_TEILWEISE = "Gespeichert — bis auf das, was unten beanstandet ist."
H_BROKER = "Broker für die MQTT-Geräte"
H_BROKER_PW = "Bleibt das Feld leer, wird das gespeicherte Passwort beibehalten. Es wird nirgends angezeigt."
H_DIENST = "Abrufdienst"
H_ENERGIE = "Energiezähler"
H_GERAETE = "Geräte"
H_INTERVALL = "Gilt nur für die HTTP-Geräte; die MQTT-Geräte melden von selbst, sobald sich etwas ändert. Der Abruf läuft im Heimnetz und kostet praktisch nichts — 15 Sekunden sind ein guter Wert, 5 Sekunden gehen auch."
H_KONFIG = "Konfiguration sichern"
H_MODELLE = "Bekannte Modelle"
H_MQTT_AUFFR = "Sonst wird nur gesendet, <b>was sich geändert hat</b>. Bis 0.9.10 gingen bei Vorgabetakt 15 s rund 5760 Durchgänge am Tag mit je etwa zwanzig Feldern je Gerät unverändert hinaus. Nach dieser Zeit geht trotzdem alles hinaus, damit ein neu gestartetes Gateway einen vollständigen Stand bekommt. 0 schaltet die Sperre ab."
H_QUITTUNGSFELD = "<b>Quittungsfeld</b> — nur für die Befehlssätze <span class='sm-mono'>hyper2000</span>, <span class='sm-mono'>ace_aio</span> und <span class='sm-mono'>hub</span> nötig. Bei ihnen ist nirgends belegt, in welcher Eigenschaft sich ein Befehl niederschlägt; ohne Eintrag bleibt die Quittung deshalb leer. Der Satz-Assistent im Reiter Test schlägt das Feld vor."
H_QUITTUNG_NACHLAUF = "So lange bekommt ein Gerät Zeit, einen gesetzten Wert zurückzumelden. Vorher ist eine Abweichung noch keine Aussage, und <span class='sm-mono'>SOLLOK</span> bleibt auf einem Strich. 0 schaltet die Nachsicht ab."
H_RUECKFALL = "Rückfall, wenn Loxone schweigt"
H_RUECKFALL_MIN = "Kommt so lange kein neuer Lade- oder Entladewert, sendet der Dienst einmal <span class='sm-mono'>aus</span>. Ladezustandsgrenzen sind davon nicht betroffen — die sind Einstellungen und sollen stehen bleiben. Die Restzeit steht als <span class='sm-mono'>RESTZEIT</span> in der Statuszeile."
H_SCHREIBBREMSE = "Mindestabstand zwischen zwei Schreibbefehlen an dasselbe Gerät. <b>Das ist kein Feinschliff.</b> Die offizielle Integration merkt zur Ace 1500 ausdrücklich an, dass jeder Schreibvorgang im Flash-Speicher des Geräts landet und ein ungebremster Regelkreis dessen Schreibfestigkeit binnen Monaten aufbrauchen würde. Dieses Plugin bremst deshalb bei allen Geräten. 0 schaltet die Bremse ab — auf eigene Gefahr."
H_SCHRITTWEITE = "Sollwerte werden auf dieses Raster abgerundet, aus demselben Grund wie die Schreibbremse. Die Rasterung wird in der Antwort gemeldet, nicht verschwiegen — Sie erfahren immer, welcher Wert tatsächlich gesendet wurde."
H_SCHUTZ = "Schutzschwellen"
H_SCHUTZ_TEMP = "Die Temperaturgrenzen stehen in der <b>eingestellten Einheit</b>. Steht die Umrechnung auf <i>roh</i>, sind es Rohwerte — dann sind 0 und 45 fast sicher falsch. Der Reiter Test zeigt, welche Einheit zu Ihrem Gerät passt."
H_STEUERUNG = "Schreibende Befehle"
H_TAKT = "Abfragetakt"
H_TEMP = "<b>In welcher Einheit Zendure die Temperatur meldet, ist nicht belegt</b> — die Home-Assistant-Integration reicht den Wert unverändert durch. Deshalb steht die Umrechnung ab Werk auf <i>roh</i>. Sehen Sie den Rohwert im Reiter Test an: liegt er bei etwa 3000, ist es Zehntel-Kelvin; liegt er bei etwa 250, sind es Zehntel-Grad; liegt er bei etwa 25, stimmt er schon."
H_TOTBAND_AUFFR = "Auch ein unveränderter Wert wird nach dieser Zeit erneut gesendet — für den Fall, dass das Gerät ihn vergessen hat (Stromausfall, Firmware-Neustart). 0 schaltet die Auffrischung ab; dann wird ein gleichbleibender Sollwert nie wieder geschrieben."
H_TOTBAND_W = "0 heißt: übergangen wird nur der <b>gleiche</b> Wert. Ein größeres Totband übergeht auch kleine Änderungen — das schont den Flash weiter, macht die Regelung aber träger."
H_VERFALL = "Ein Befehl liegt im Dateisystem, nicht in der Anfrage. Steht der Dienst — abgestürzt, angehalten, LoxBerry neu gestartet —, wird er beim nächsten Start ausgeführt, gleich wie viele Stunden später. Ein <span class='sm-mono'>laden 3000 W</span> von gestern Abend heute früh auszuführen ist keine verspätete Regelung, sondern eine falsche. Betrifft nur Lade- und Entladewerte; <span class='sm-mono'>aus</span>, Grenzen und Abruf verfallen nicht."
H_WARTEZEIT = "So lange wartet der Miniserver-Endpunkt auf das Ergebnis eines Befehls. Kommt nichts, meldet er <span class='sm-mono'>OK=2</span> — eingereiht, Ergebnis unbekannt. Ein Erfolg, den niemand geprüft hat, wird nie gemeldet."
H_WIEDERHOLUNG = "Wiederholungssperre"
