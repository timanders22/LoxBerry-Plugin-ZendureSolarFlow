[LOX]
EINLEITUNG = "Loxone ist der Energiemanager: Das Plugin liefert die Messwerte, der Miniserver entscheidet. Zwei Wege stehen zur Verf&uuml;gung &mdash; MQTT ist der Regelweg, der HTTP-Endpunkt die Alternative, wenn einzelne Werte gezielt geholt oder Befehle gesendet werden sollen."
H_TITEL = "Einbindung in Loxone, Schritt für Schritt"
K_TOKEN_NEU = "Neues Token erzeugen"
K_VORLAGE = "Vorlage für Loxone Config herunterladen"
MEHRERE = "Mehrere Geräte: je Gerät eine eigene Adresse."
S1_TEXT = "<b>MQTT ist der Regelweg.</b> Das Gateway erzeugt die Namen der virtuellen Eing&auml;nge selbst; in Loxone gen&uuml;gt ein passend benannter virtueller Eingang. Der HTTP-Weg verlangt je Wert eine eigene Befehlserkennung &mdash; daf&uuml;r kann er auch schalten, was MQTT hier nicht kann. Beides parallel ist erlaubt und in vielen Anlagen sinnvoll: MQTT f&uuml;r die laufenden Werte, HTTP f&uuml;r die Befehle."
S1_TITEL = "Schritt 1: Weg festlegen"
S2_TEXT = "In <i>System &rarr; MQTT Gateway</i> unter <i>Subscriptions</i> eintragen und speichern:"
S2_TITEL = "Schritt 2: Abo im MQTT-Gateway eintragen"
S2_WARNUNG = "<b>Ohne diesen Eintrag kommt am Miniserver nichts an.</b> Das ist die h&auml;ufigste Fehlerursache &uuml;berhaupt."
S3_BEFEHLE = "Darunter je Wert ein <i>Virtueller HTTP-Eingang Befehl</i>. In der Befehlserkennung steht der Suchtext zwischen <span class='sm-mono'>\i...\i</span>, <span class='sm-mono'>\v</span> nimmt die Zahl dahinter auf."
S3_STRICH = "<b>Ein Strich statt einer Zahl</b> bedeutet: das Ger&auml;t hat dieses Feld nicht geliefert. Es wird bewusst keine 0 gesendet &mdash; eine 0 w&auml;re eine stille Falschaussage. Loxone beh&auml;lt dann den zuletzt g&uuml;ltigen Wert. Genau deshalb geh&ouml;ren <span class='sm-mono'>ALTER</span> und <span class='sm-mono'>OK</span> immer mit ausgewertet: ohne sie sieht ein eingefrorener Wert in der App aus wie ein aktueller."
S3_TEXT = "&Uuml;ber MQTT entstehen die Eing&auml;nge von selbst. Wer den HTTP-Weg nimmt, legt in Loxone Config einen <i>Virtuellen HTTP-Eingang</i> mit dieser Adresse an:"
S3_TITEL = "Schritt 3: Virtuelle Eingänge anlegen"
S4_TEXT = "Nur n&ouml;tig, wenn Loxone den Speicher steuern soll. Voraussetzung: im Reiter Einstellungen sind schreibende Befehle freigegeben. Ein <i>Virtueller Ausgang</i> mit der Adresse des LoxBerry, darunter je Befehl ein <i>Virtueller Ausgang Befehl</i>; <span class='sm-mono'>&lt;v&gt;</span> setzt Loxone durch den Zahlenwert."
S4_TITEL = "Schritt 4: Befehle senden (virtueller Ausgang)"
S4_WARNUNG = "<b>Zwei Dinge, die man vorher wissen sollte.</b> Erstens: Es gibt <b>keinen Watchdog</b>. F&auml;llt Loxone aus, bleibt der zuletzt gesendete Sollwert stehen; wer das nicht will, l&auml;sst Loxone vor dem geplanten Herunterfahren einmal <span class='sm-mono'>aktion=aus</span> senden. Zweitens: Die <b>Schreibbremse</b> weist Befehle ab, die zu dicht aufeinander folgen &mdash; ein Regelkreis, der im Sekundentakt sendet, bekommt lauter Absagen. Der Sendetakt in Loxone muss zur Bremse passen, nicht umgekehrt."
S5_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht. Deshalb ist er durch ein Token gesch&uuml;tzt; ohne passendes Token antwortet er mit HTTP 403. Ein neues Token macht alle bereits eingetragenen Adressen im Miniserver ung&uuml;ltig."
S5_TITEL = "Schritt 5: Das Token"
S6_TEXT = "Schweigt ein Ger&auml;t, behalten die virtuellen Eing&auml;nge ihren letzten Wert &mdash; in der App sieht dann alles normal aus. Deshalb wird <span class='sm-mono'>ALTER</span> ausgewertet: es z&auml;hlt die Sekunden seit dem letzten Wert dieses Ger&auml;ts. Die Schwelle deutlich &uuml;ber den Abholtakt legen, damit ein einzelner verpasster Durchlauf keine Meldung ausl&ouml;st: bei 15 s Takt ist 180 s ein guter Wert. Nebenbei erspart <span class='sm-mono'>ALTER</span> jede Zeitrechnung &mdash; Loxone z&auml;hlt Sekunden seit dem 01.01.2009, ein Unix-Zeitstempel m&uuml;sste also erst um 1230768000 verringert werden."
S6_TITEL = "Schritt 6: Ausfallerkennung"
S7_ERLAEUTERUNG = "<b>Zu #9:</b> Die Schwelle liegt bewusst weit &uuml;ber dem Abholtakt. Bei 15 s Takt l&ouml;st ein einzelner verpasster Durchlauf sonst schon eine Meldung aus.<br><b>Zu #11 und #13:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Deshalb niemals mehrere Quellen direkt an seinen Eingang legen, sondern erst &uuml;ber ein ODER zusammenf&uuml;hren &mdash; sonst verschluckt eine dauerhaft aktive Quelle alle &uuml;brigen.<br><b>Zu #24:</b> Der Sendetakt muss <b>l&auml;nger</b> sein als die Schreibbremse im Reiter Einstellungen, sonst weist der Dienst jeden zweiten Befehl ab. 60 s zu 30 s Bremse ist ein sicheres Verh&auml;ltnis.<br><b>Zu #27 und #28:</b> Laden und Entladen sind zwei getrennte Befehle. Sie d&uuml;rfen sich nicht &uuml;berholen &mdash; deshalb steht vor beiden derselbe Impulsgeber, und der Ladezweig ist &uuml;ber #17 gesperrt, solange entladen wird.<br><b>Optional</b> sind #14 bis #16 (Tiefstandswarnung und Anzeige)."
S7_TEXT = "Jede Zeile ist ein Baustein. Loxone Config f&uuml;hrt sie alle in der Baustein-Suche (Taste F5). Die Zeilen 1 bis 16 bauen die reine &Uuml;berwachung samt Ausfall- und Tiefstandsmeldung &mdash; das gen&uuml;gt, wenn Loxone nur zusehen soll. Die Zeilen 17 bis 28 kommen dazu, wenn Loxone die Leistung vorgeben soll; sie setzen freigegebene schreibende Befehle voraus."
S7_TITEL = "Schritt 7: Komplette Baustein-Liste zum 1:1-Nachbauen"
S8_TEXT = "Diese drei Adressen im Browser aufrufen. Antwortet die erste mit Werten, die zweite mit 403 und die dritte mit 400, dann tr&auml;gt die Einrichtung."
S8_TITEL = "Schritt 8: Gegenprobe"
