[LOX]
EINLEITUNG = "Loxone ist der Energiemanager: Das Plugin liefert die Messwerte, der Miniserver entscheidet. Zwei Wege stehen zur Verfügung — MQTT ist der Regelweg, der HTTP-Endpunkt die Alternative, wenn einzelne Werte gezielt geholt oder Befehle gesendet werden sollen."
H_TITEL = "Einbindung in Loxone, Schritt für Schritt"
H_VORLAGE_ZEITRAUM = "Betrifft nur die Vorlage der Energiewerte. Für Tag, Monat und Jahr gibt es je eine eigene Vorlage — laden Sie herunter, was Sie brauchen."
K_TOKEN_NEU = "Neues Token erzeugen"
K_VORLAGE = "Vorlage für Loxone Config herunterladen"
K_VORLAGE_ALLE = "Alle Vorlagen als Archiv"
K_VORLAGE_BEFEHLE = "Vorlage der Steuerbefehle erzeugen"
K_VORLAGE_ENERGIE = "Vorlage der Energiewerte erzeugen"
K_VORLAGE_SUMME = "Vorlage der Summe erzeugen"
L_VORLAGE_GERAET = "Vorlage für Gerät"
L_VORLAGE_ZEITRAUM = "Zeitraum der Energievorlage"
MEHRERE = "Mehrere Geräte: je Gerät eine eigene Adresse."
S1_TEXT = "<b>MQTT ist der Regelweg.</b> Das Gateway erzeugt die Namen der virtuellen Eingänge selbst; in Loxone genügt ein passend benannter virtueller Eingang. Der HTTP-Weg verlangt je Wert eine eigene Befehlserkennung — dafür kann er auch schalten, was MQTT hier nicht kann. Beides parallel ist erlaubt und in vielen Anlagen sinnvoll: MQTT für die laufenden Werte, HTTP für die Befehle."
S1_TITEL = "Schritt 1: Weg festlegen"
S2_TEXT = "In <i>System → MQTT Gateway</i> unter <i>Subscriptions</i> eintragen und speichern:"
S2_TITEL = "Schritt 2: Abo im MQTT-Gateway eintragen"
S3_BEFEHLE = "Darunter je Wert ein <i>Virtueller HTTP-Eingang Befehl</i>. In der Befehlserkennung steht der Suchtext zwischen <span class='sm-mono'>\i...\i</span>, <span class='sm-mono'>\v</span> nimmt die Zahl dahinter auf."
S3_STRICH = "<b>Ein Strich statt einer Zahl</b> bedeutet: das Gerät hat dieses Feld nicht geliefert. Es wird bewusst keine 0 gesendet — eine 0 wäre eine stille Falschaussage. Loxone behält dann den zuletzt gültigen Wert. Genau deshalb gehören <span class='sm-mono'>ALTER</span> und <span class='sm-mono'>OK</span> immer mit ausgewertet: ohne sie sieht ein eingefrorener Wert in der App aus wie ein aktueller."
S3_TEXT = "Über MQTT entstehen die Eingänge von selbst. Wer den HTTP-Weg nimmt, legt in Loxone Config einen <i>Virtuellen HTTP-Eingang</i> mit dieser Adresse an:"
S3_TITEL = "Schritt 3: Virtuelle Eingänge anlegen"
S4_TEXT = "Nur nötig, wenn Loxone den Speicher steuern soll. Voraussetzung: im Reiter Einstellungen sind schreibende Befehle freigegeben. Ein <i>Virtueller Ausgang</i> mit der Adresse des LoxBerry, darunter je Befehl ein <i>Virtueller Ausgang Befehl</i>; <span class='sm-mono'>&lt;v&gt;</span> setzt Loxone durch den Zahlenwert."
S4_TITEL = "Schritt 4: Befehle senden (virtueller Ausgang)"
S4_VORLAGE = "Diese Adressen müssen Sie <b>nicht</b> abschreiben: der Knopf <i>Vorlage der Steuerbefehle erzeugen</i> weiter oben legt sie fertig an, mit eingesetztem Token."
S4_WARNUNG = "<b>Zwei Dinge, die man vorher wissen sollte.</b> Erstens: Es gibt <b>keinen Watchdog</b>. Fällt Loxone aus, bleibt der zuletzt gesendete Sollwert stehen; wer das nicht will, lässt Loxone vor dem geplanten Herunterfahren einmal <span class='sm-mono'>aktion=aus</span> senden. Zweitens: Die <b>Schreibbremse</b> weist Befehle ab, die zu dicht aufeinander folgen — ein Regelkreis, der im Sekundentakt sendet, bekommt lauter Absagen. Der Sendetakt in Loxone muss zur Bremse passen, nicht umgekehrt."
S5_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht. Deshalb ist er durch ein Token geschützt; ohne passendes Token antwortet er mit HTTP 403. Ein neues Token macht alle bereits eingetragenen Adressen im Miniserver ungültig."
S5_TITEL = "Schritt 5: Das Token"
S6_TEXT = "Schweigt ein Gerät, behalten die virtuellen Eingänge ihren letzten Wert — in der App sieht dann alles normal aus. Deshalb wird <span class='sm-mono'>ALTER</span> ausgewertet: es zählt die Sekunden seit dem letzten Wert dieses Geräts. Die Schwelle deutlich über den Abholtakt legen, damit ein einzelner verpasster Durchlauf keine Meldung auslöst: bei 15 s Takt ist 180 s ein guter Wert. Nebenbei erspart <span class='sm-mono'>ALTER</span> jede Zeitrechnung — Loxone zählt Sekunden seit dem 01.01.2009, ein Unix-Zeitstempel müsste also erst um 1230768000 verringert werden."
S6_TITEL = "Schritt 6: Ausfallerkennung"
S7_ERLAEUTERUNG = "<b>Zu #9:</b> Die Schwelle liegt bewusst weit über dem Abholtakt. Bei 15 s Takt löst ein einzelner verpasster Durchlauf sonst schon eine Meldung aus.<br><b>Zu #11 und #13:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Deshalb niemals mehrere Quellen direkt an seinen Eingang legen, sondern erst über ein ODER zusammenführen — sonst verschluckt eine dauerhaft aktive Quelle alle übrigen.<br><b>Zu #24:</b> Der Sendetakt muss <b>länger</b> sein als die Schreibbremse im Reiter Einstellungen, sonst weist der Dienst jeden zweiten Befehl ab. 60 s zu 30 s Bremse ist ein sicheres Verhältnis.<br><b>Zu #27 und #28:</b> Laden und Entladen sind zwei getrennte Befehle. Sie dürfen sich nicht überholen — deshalb steht vor beiden derselbe Impulsgeber, und der Ladezweig ist über #17 gesperrt, solange entladen wird.<br><b>Optional</b> sind #14 bis #16 (Tiefstandswarnung und Anzeige)."
S7_TEXT = "Jede Zeile ist ein Baustein. Loxone Config führt sie alle in der Baustein-Suche (Taste F5). Die Zeilen 1 bis 16 bauen die reine Überwachung samt Ausfall- und Tiefstandsmeldung — das genügt, wenn Loxone nur zusehen soll. Die Zeilen 17 bis 28 kommen dazu, wenn Loxone die Leistung vorgeben soll; sie setzen freigegebene schreibende Befehle voraus."
S7_TITEL = "Schritt 7: Komplette Baustein-Liste zum 1:1-Nachbauen"
S8_TEXT = "Diese drei Adressen im Browser aufrufen. Antwortet die erste mit Werten, die zweite mit 403 und die dritte mit 400, dann trägt die Einrichtung."
S8_TITEL = "Schritt 8: Gegenprobe"
S9_EINGAENGE = "Leistung ← <span class='sm-mono'>BATP</span>, Speicherstand ← <span class='sm-mono'>SOC</span>"
S9_HERKUNFT = "Die Parameter stammen aus Loxones eigenem Beispiel <span class='sm-mono'>Energy-Flow-Monitor-and-Energy-Manager.loxone</span>, nicht aus einer Vermutung."
S9_KW = "<b>Achtung Einheit:</b> das Plugin liefert <b>Watt</b>, der Baustein zeigt Kilowatt an. Setzen Sie einen Formel-Baustein <span class='sm-mono'>I1/1000</span> dazwischen, oder stellen Sie die Einheit des Eingangs entsprechend."
S9_TEXT = "Loxone führt einen Speicher im Energiefluss-Monitor über einen <b>Zähler-Baustein mit absolutem Speicherstand</b>. Er braucht zwei Eingänge: die Leistung und den Ladezustand in Prozent. Beides liefert dieses Plugin bereits."
S9_TITEL = "Anschluss an den Energiefluss-Monitor"
S9_ZAEHLER = "Zähler mit absolutem Speicherstand"
