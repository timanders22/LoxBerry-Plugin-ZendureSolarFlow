GERAETE_ERKLAERUNG = "<b>Zendure l&auml;sst sich lokal ansprechen</b> &mdash; ein Zendure-Konto braucht dieses Plugin nicht. Es gibt zwei Wege, und welcher gilt, h&auml;ngt am Modell:<br><b>HTTP</b> &mdash; SolarFlow 800 und die AC-Reihe beantworten im Heimnetz unmittelbar <span class='sm-mono'>http://&lt;ip&gt;/properties/report</span>. Es gen&uuml;gt die IP-Adresse.<br><b>MQTT</b> &mdash; Hub 1200, Hub 2000, Hyper 2000, Ace 1500 und AIO 2400 sprechen nur MQTT. Sie werden einmalig auf den Broker des LoxBerry umgestellt (siehe Reiter MQTT) und melden sich danach von selbst. Daf&uuml;r werden Produktschl&uuml;ssel und Ger&auml;tekennung gebraucht."
GERAETE_HILFE = "<b>Produktschl&uuml;ssel und Ger&auml;tekennung</b> stehen in den Themen, die das Ger&auml;t am Broker ver&ouml;ffentlicht: <span class='sm-mono'>/&lt;Produktschl&uuml;ssel&gt;/&lt;Ger&auml;tekennung&gt;/properties/report</span>. Wer sie nicht kennt, l&auml;sst sich im MQTT-Gateway des LoxBerry unter <i>MQTT Finder</i> alle eingehenden Themen anzeigen &mdash; dort stehen beide.<br><b>Leere Leistungsgrenzen</b> bedeuten: die Werksgrenze des gew&auml;hlten Modells gilt (Tabelle unten). Wer ein Modell hat, das dort nicht steht, tr&auml;gt die Grenzen selbst ein."
GESPEICHERT = "Die Einstellungen wurden gespeichert, samt Sicherungskopie f&uuml;r Updates."
H_BROKER = "Broker für die MQTT-Geräte"
H_BROKER_PW = "Bleibt das Feld leer, wird das gespeicherte Passwort beibehalten. Es wird nirgends angezeigt."
H_DIENST = "Abrufdienst"
H_GERAETE = "Geräte"
H_INTERVALL = "Gilt nur f&uuml;r die HTTP-Ger&auml;te; die MQTT-Ger&auml;te melden von selbst, sobald sich etwas &auml;ndert. Der Abruf l&auml;uft im Heimnetz und kostet praktisch nichts &mdash; 15 Sekunden sind ein guter Wert, 5 Sekunden gehen auch."
H_MODELLE = "Bekannte Modelle"
H_SCHREIBBREMSE = "Mindestabstand zwischen zwei Schreibbefehlen an dasselbe Ger&auml;t. <b>Das ist kein Feinschliff.</b> Die offizielle Integration merkt zur Ace 1500 ausdr&uuml;cklich an, dass jeder Schreibvorgang im Flash-Speicher des Ger&auml;ts landet und ein ungebremster Regelkreis dessen Schreibfestigkeit binnen Monaten aufbrauchen w&uuml;rde. Dieses Plugin bremst deshalb bei allen Ger&auml;ten. 0 schaltet die Bremse ab &mdash; auf eigene Gefahr."
H_SCHRITTWEITE = "Sollwerte werden auf dieses Raster abgerundet, aus demselben Grund wie die Schreibbremse. Die Rasterung wird in der Antwort gemeldet, nicht verschwiegen &mdash; Sie erfahren immer, welcher Wert tats&auml;chlich gesendet wurde."
H_STEUERUNG = "Schreibende Befehle"
H_TAKT = "Abfragetakt"
H_TEMP = "<b>In welcher Einheit Zendure die Temperatur meldet, ist nicht belegt</b> &mdash; die Home-Assistant-Integration reicht den Wert unver&auml;ndert durch. Deshalb steht die Umrechnung ab Werk auf <i>roh</i>. Sehen Sie den Rohwert im Reiter Test an: liegt er bei etwa 3000, ist es Zehntel-Kelvin; liegt er bei etwa 250, sind es Zehntel-Grad; liegt er bei etwa 25, stimmt er schon."
H_WARTEZEIT = "So lange wartet der Miniserver-Endpunkt auf das Ergebnis eines Befehls. Kommt nichts, meldet er <span class='sm-mono'>OK=2</span> &mdash; eingereiht, Ergebnis unbekannt. Ein Erfolg, den niemand gepr&uuml;ft hat, wird nie gemeldet."
