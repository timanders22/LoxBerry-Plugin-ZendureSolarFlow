FEHLER_ZAHL = "%s: bitte eine ganze Zahl eintragen."
GERAETE_ERKLAERUNG = "<b>Zendure lässt sich lokal ansprechen</b> — ein Zendure-Konto braucht dieses Plugin nicht. Es gibt zwei Wege, und welcher gilt, hängt am Modell:<br><b>HTTP</b> — SolarFlow 800 und die AC-Reihe beantworten im Heimnetz unmittelbar <span class='sm-mono'>http://&lt;ip&gt;/properties/report</span>. Es genügt die IP-Adresse.<br><b>MQTT</b> — Hub 1200, Hub 2000, Hyper 2000, Ace 1500 und AIO 2400 sprechen nur MQTT. Sie werden einmalig auf den Broker des LoxBerry umgestellt (siehe Reiter MQTT) und melden sich danach von selbst. Dafür werden Produktschlüssel und Gerätekennung gebraucht."
GERAETE_HILFE = "<b>Produktschlüssel und Gerätekennung</b> stehen in den Themen, die das Gerät am Broker veröffentlicht: <span class='sm-mono'>/&lt;Produktschlüssel&gt;/&lt;Gerätekennung&gt;/properties/report</span>. Wer sie nicht kennt, lässt sich im MQTT-Gateway des LoxBerry unter <i>MQTT Finder</i> alle eingehenden Themen anzeigen — dort stehen beide.<br><b>Leere Leistungsgrenzen</b> bedeuten: die Werksgrenze des gewählten Modells gilt (Tabelle unten). Wer ein Modell hat, das dort nicht steht, trägt die Grenzen selbst ein."
GESPEICHERT = "Die Einstellungen wurden gespeichert, samt Sicherungskopie für Updates."
H_BROKER = "Broker für die MQTT-Geräte"
H_BROKER_PW = "Bleibt das Feld leer, wird das gespeicherte Passwort beibehalten. Es wird nirgends angezeigt."
H_DIENST = "Abrufdienst"
H_GERAETE = "Geräte"
H_INTERVALL = "Gilt nur für die HTTP-Geräte; die MQTT-Geräte melden von selbst, sobald sich etwas ändert. Der Abruf läuft im Heimnetz und kostet praktisch nichts — 15 Sekunden sind ein guter Wert, 5 Sekunden gehen auch."
H_MODELLE = "Bekannte Modelle"
H_SCHREIBBREMSE = "Mindestabstand zwischen zwei Schreibbefehlen an dasselbe Gerät. <b>Das ist kein Feinschliff.</b> Die offizielle Integration merkt zur Ace 1500 ausdrücklich an, dass jeder Schreibvorgang im Flash-Speicher des Geräts landet und ein ungebremster Regelkreis dessen Schreibfestigkeit binnen Monaten aufbrauchen würde. Dieses Plugin bremst deshalb bei allen Geräten. 0 schaltet die Bremse ab — auf eigene Gefahr."
H_SCHRITTWEITE = "Sollwerte werden auf dieses Raster abgerundet, aus demselben Grund wie die Schreibbremse. Die Rasterung wird in der Antwort gemeldet, nicht verschwiegen — Sie erfahren immer, welcher Wert tatsächlich gesendet wurde."
H_STEUERUNG = "Schreibende Befehle"
H_TAKT = "Abfragetakt"
H_TEMP = "<b>In welcher Einheit Zendure die Temperatur meldet, ist nicht belegt</b> — die Home-Assistant-Integration reicht den Wert unverändert durch. Deshalb steht die Umrechnung ab Werk auf <i>roh</i>. Sehen Sie den Rohwert im Reiter Test an: liegt er bei etwa 3000, ist es Zehntel-Kelvin; liegt er bei etwa 250, sind es Zehntel-Grad; liegt er bei etwa 25, stimmt er schon."
H_WARTEZEIT = "So lange wartet der Miniserver-Endpunkt auf das Ergebnis eines Befehls. Kommt nichts, meldet er <span class='sm-mono'>OK=2</span> — eingereiht, Ergebnis unbekannt. Ein Erfolg, den niemand geprüft hat, wird nie gemeldet."
