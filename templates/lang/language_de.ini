[EINST]
BROKER_ERKLAERUNG = "Nur nötig, wenn mindestens ein Gerät über MQTT läuft. Bleiben die Felder leer, nimmt das Plugin den Broker aus den LoxBerry-Systemeinstellungen — also in aller Regel den richtigen. Die Zugangsdaten werden dem Aufruf von mosquitto nicht auf der Kommandozeile mitgegeben, sondern über dessen Vorgabedatei mit den Rechten 0600: auf der Kommandozeile stünden sie in der Prozessliste."
DIENST_ERKLAERUNG = "Der Dienst fragt die Geräte mit HTTP-Schnittstelle im eingestellten Takt ab und hört gleichzeitig auf die Geräte, die ihre Werte per MQTT melden. Oberfläche und Miniserver lesen nur den Zwischenspeicher — sie sprechen selbst nie mit einem Gerät. Ein minutlicher Wächter startet den Dienst neu, wenn er abstürzt; ein von Hand angehaltener Dienst bleibt angehalten."
DIENST_RESTART = "Dienst neu gestartet."
DIENST_START = "Dienst gestartet."
DIENST_STOP = "Dienst angehalten."
