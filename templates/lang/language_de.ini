MODELLE_HILFE = "Diese Tabelle ist im Quelltext der offiziellen Home-Assistant-Integration von Zendure nachgesehen, Zeile f&uuml;r Zeile. Modelle, die dort nicht nachgesehen wurden &mdash; etwa Hub 2000, SolarFlow 1600 AC+ und SolarFlow 4000 AC+ &mdash; stehen bewusst <b>nicht</b> darin: geraten wird nichts. F&uuml;r sie w&auml;hlt man den Befehlssatz von Hand und probiert ihn im Reiter Test durch. Die drei S&auml;tze unterscheiden sich nicht im Namen, sondern in der Form der Nachricht; ein falscher Satz f&uuml;hrt nicht zu einer Fehlermeldung, sondern dazu, dass schlicht nichts passiert."
