[EINST]
BROKER_ERKLAERUNG = "Nur n&ouml;tig, wenn mindestens ein Ger&auml;t &uuml;ber MQTT l&auml;uft. Bleiben die Felder leer, nimmt das Plugin den Broker aus den LoxBerry-Systemeinstellungen &mdash; also in aller Regel den richtigen. Die Zugangsdaten werden dem Aufruf von mosquitto nicht auf der Kommandozeile mitgegeben, sondern &uuml;ber dessen Vorgabedatei mit den Rechten 0600: auf der Kommandozeile st&uuml;nden sie in der Prozessliste."
DIENST_ERKLAERUNG = "Der Dienst fragt die Ger&auml;te mit HTTP-Schnittstelle im eingestellten Takt ab und h&ouml;rt gleichzeitig auf die Ger&auml;te, die ihre Werte per MQTT melden. Oberfl&auml;che und Miniserver lesen nur den Zwischenspeicher &mdash; sie sprechen selbst nie mit einem Ger&auml;t. Ein minutlicher W&auml;chter startet den Dienst neu, wenn er abst&uuml;rzt; ein von Hand angehaltener Dienst bleibt angehalten."
DIENST_RESTART = "Dienst neu gestartet."
