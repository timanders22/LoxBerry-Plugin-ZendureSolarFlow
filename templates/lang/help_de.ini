; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Zendure SolarFlow"
K02 = "Bindet Zendure-SolarFlow-Speicher an Loxone an — <b>ohne Cloud und ohne Zendure-Konto</b>."
K03 = "Zwei Wege, beide lokal"
K04 = "<b>HTTP</b> — SolarFlow 800, 800 Plus, 800 Pro und die AC-Reihe beantworten im Heimnetz unmittelbar <span class='sm-mono'>http://&lt;ip&gt;/properties/report</span>. Es genügt, die IP-Adresse einzutragen."
K05 = "<b>MQTT</b> — Hub 1200, Hub 2000, Hyper 2000, Ace 1500 und AIO 2400 sprechen nur MQTT. Sie werden einmalig auf den Broker des LoxBerry umgestellt (Zendure-App oder Bluetooth-Werkzeug) und melden sich danach von selbst. <b>Achtung:</b> Danach zeigt die Zendure-App keine Werte mehr an — ein Gerät kann entweder Cloud oder lokal, nicht beides."
K06 = "So gehen Sie vor"
K07 = "<b>Einstellungen:</b> Geräte eintragen, speichern, dann <i>Dienst starten</i>."
K08 = "<b>Test:</b> Die Selbstprüfung sagt Zeile für Zeile, ob es trägt. Jedes Kreuz nennt die Abhilfe mit."
K09 = "<b>MQTT:</b> Das Abo im MQTT-Gateway trägt das Plugin selbst in seine Abo-Datei ein (mqtt_subscriptions.cfg). Nur wenn der Reiter MQTT rot meldet, dass sie fehlt, gehört es von Hand unter Subscriptions — ohne Abo kommt am Miniserver nichts an."
K10 = "<b>Einbindung in Loxone:</b> Schritt für Schritt, mit vollständiger Baustein-Liste zum Nachbauen."
K11 = "Die Schreibbremse"
K12 = "Jeder Schreibbefehl landet bei manchen Geräten im Flash-Speicher. Die offizielle Home-Assistant-Integration merkt zur Ace 1500 ausdrücklich an, ein ungebremster Regelkreis würde deren Schreibfestigkeit binnen Monaten aufbrauchen. Dieses Plugin lässt deshalb höchstens einen Befehl je 30 Sekunden durch und rastert Sollwerte auf 50 W. <b>Der Sendetakt in Loxone muss dazu passen</b> — sonst weist der Dienst jeden zweiten Befehl ab. Derselbe Wert innerhalb von 60 Sekunden wird gar nicht erst gesendet und mit <span class='sm-mono'>UNVERAENDERT=1</span> beantwortet; die Bremse gilt für einen anderen Wert."
K13 = "Rückfall, wenn Loxone schweigt"
K14 = "Zendure stoppt nicht von selbst, wenn Loxone schweigt: ein gesetzter Sollwert bleibt stehen. Dafür hat das Plugin einen Rückfall (Watchdog): Reiter Einstellungen, <i>Rückfall nach (Minuten)</i> — ab Werk aus. Eingeschaltet sendet der Dienst nach dieser Zeit ohne neuen Lade- oder Entladewert einmal <span class='sm-mono'>aus</span> und versucht es erneut, wenn das Gerät ablehnt. Ladezustandsgrenzen bleiben stehen."
K15 = "Was ungeprüft ist"
K16 = "Dieses Plugin wurde ohne Zendure-Gerät gebaut. Die Eigenschaftsnamen, die Befehlsformen und die Einheiten von Temperatur und Zellspannung konnten deshalb nicht am lebenden System nachgemessen werden. Bleibt ein Wert leer, ist das eher ein anders benanntes Feld als eine Störung: der Knopf <i>Rohdaten als JSON ansehen</i> im Reiter Test zeigt, wie die Felder bei Ihnen wirklich heißen."
K17 = "Grundlage"
K18 = "Alle Protokollangaben stammen aus der offiziellen Home-Assistant-Integration von Zendure (Zendure/Zendure-HA, MIT-Lizenz)."
