[AUTHOR]
NAME=Zendure SolarFlow Plugin Authors
EMAIL=zenduresolarflow@users.noreply.github.com

[PLUGIN]
VERSION=0.9.51
NAME=zendure
FOLDER=zendure
TITLE=Zendure SolarFlow

# Adresse der Dokumentation (seit 0.9.49, Modul-1.2.9-Welle 18.11.2026): LoxBerry liest sie bei der
# Installation (plugininstall.pl, PLUGIN.WEBSITE) und zeigt sie als Knopf "Dokumentation". Besitzer und
# Repository wie in ARCHIVEURL der release.cfg.
WEBSITE=https://github.com/timanders22/LoxBerry-Plugin-ZendureSolarFlow

[AUTOUPDATE]
# Selbstaktualisierung ueber das EIGENE Repository. Beide Adressen zeigen auf
# den Zweig master - LoxBerry liest die Fassung dort und vergleicht sie mit der
# oben. Solange beide 0.9.1 lauten, wird niemandem etwas angeboten; sobald der
# Zweig 1.0.0 fuehrt, greift die Aktualisierung von selbst.
#
# Wichtig: Adressen NIE auf ein fremdes Repository richten. LoxBerry vergleicht
# Fassungen als Zahl, und ein fremdes 2021.05.14 waere groesser als 1.0.0 -
# daraus wuerde ein stilles Downgrade (Hausregel, belegt am Docker-Plugin).
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-ZendureSolarFlow/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-ZendureSolarFlow/master/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
